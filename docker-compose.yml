services:
  nginx:
    image: nginx:1.25.4-alpine
    container_name: yingyao-static
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/usr/share/nginx/html:ro
      - ./acme:/var/www/acme:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - TZ=Asia/Shanghai
