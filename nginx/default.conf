# HTTP requests for both sites are redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name yingyaozw.com www.yingyaozw.com sport.yingyaozw.com toy.yingyaozw.com case.yingyaozw.com pet.yingyaozw.com grocery.yingyaozw.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Yingyao Offsite application on the apex domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yingyaozw.com;

    ssl_certificate /etc/nginx/ssl/yingyaozw.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yingyaozw.com.key;

    include /etc/nginx/snippets/security-headers.conf;


    location / {
        proxy_pass http://172.18.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

# Noon storefronts on the category subdomains.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sport.yingyaozw.com toy.yingyaozw.com case.yingyaozw.com pet.yingyaozw.com grocery.yingyaozw.com;

    ssl_certificate /etc/nginx/ssl/yingyao-subdomains.pem;
    ssl_certificate_key /etc/nginx/ssl/yingyao-subdomains.key;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://yingyao-noon-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

# Dedicated www handling preserves the existing main-site redirect outside admin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yingyaozw.com;
    ssl_certificate /etc/nginx/ssl/yingyaozw.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yingyaozw.com.key;
    include /etc/nginx/snippets/security-headers.conf;

    location = /admin1101 {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_backend yingyao-admin-v2-app-1:3000;
        proxy_pass http://$admin_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }
    location ^~ /admin1101/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_backend yingyao-admin-v2-app-1:3000;
        proxy_pass http://$admin_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }
    location / {
        return 301 https://yingyaozw.com$request_uri;
    }
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
